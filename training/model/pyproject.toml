[project]
name = "stepwave-model"
version = "0.1.0"
description = "stepwave footstep band-mask model: feature prep, training, .swm export, evaluation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "torch>=2.7",
    "typer>=0.12",
    "tqdm>=4.66",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# Only `trainer prep` and `trainer eval` need these; the Windows training box does not.
audio = ["stepwave-py", "soundfile>=0.12"]

[project.scripts]
trainer = "stepwave_model.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stepwave_model"]

[tool.uv.sources]
stepwave-py = { path = "../../bindings/python" }
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
known-first-party = ["helpers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
