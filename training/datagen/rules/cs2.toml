# Path rules: first match wins; unmatched files become "other".
# Patterns are globs on the path relative to training/data/raw/:
#   *  one path segment part, ** any depth, {surface} / {map} capture one segment.
#
# Derived from the CS2 sound tree exported by Source2Viewer-CLI 20.0:
#   sounds/player/footsteps/<surface>_NN.wav   flat folder, surface in the file name
#   sounds/weapons/<weapon>/<weapon>_NN.wav     fire, mixed with reload/draw/inspect foley
#   sounds/weapons/{hegrenade,flashbang,c4,molotov,incgrenade,smokegrenade}/  utility
#   sounds/ambient/<map>/ and sounds/ambient/common/<category>/

# ---------------------------------------------------------------- footsteps
# Landings (and the jump push-off) are footstep-like impacts: one "land" surface.
[[rule]]
pattern = "sounds/player/footsteps/land_*"
class = "footsteps"
surface = "land"

[[rule]]
pattern = "sounds/player/footsteps/jump_*"
class = "footsteps"
surface = "land"

[[rule]]
pattern = "sounds/player/land*"
class = "footsteps"
surface = "land"

[[rule]]
pattern = "sounds/player/footsteps/ladder*"
class = "footsteps"
surface = "ladder"

[[rule]]
pattern = "sounds/player/footsteps/water_*"
class = "footsteps"
surface = "water"

[[rule]]
pattern = "sounds/player/footsteps/puddle*"
class = "footsteps"
surface = "water"

[[rule]]
pattern = "sounds/player/footsteps/wet_*"
class = "footsteps"
surface = "water"

[[rule]]
pattern = "sounds/player/pl_wade*"
class = "footsteps"
surface = "water"

[[rule]]
pattern = "sounds/player/water/pl_wade*"
class = "footsteps"
surface = "water"

# Clothing/gear rustle layered on every step (CT and T variants).
[[rule]]
pattern = "sounds/player/footsteps/suit_*"
class = "footsteps"
surface = "suit"

[[rule]]
pattern = "sounds/player/footsteps/concrete_*"
class = "footsteps"
surface = "concrete"

[[rule]]
pattern = "sounds/player/footsteps/metal_railing_*"
class = "footsteps"
surface = "metal_railing"

# Everything else: <surface>_NN.* (carpet, dirt, grass, gravel, tile, wood, sand, snow,
# mud, glass, rubber, metal_solid, metal_grate, metal_chainlink, metal_auto, metal_vent,
# plastic_barrel, and the generic "bass" low-end layer).
[[rule]]
pattern = "sounds/player/footsteps/{surface}_??.*"
class = "footsteps"

