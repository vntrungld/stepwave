[project]
name = "stepwave-datagen"
version = "0.1.0"
description = "Synthetic training-data generator for stepwave"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "scipy>=1.13",
    "soundfile>=0.12",
    "h5py>=3.11",
    "typer>=0.12",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "stepwave-py",
]

[project.scripts]
datagen = "stepwave_datagen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stepwave_datagen"]

[tool.uv.sources]
stepwave-py = { path = "../../bindings/python" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
known-first-party = ["helpers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
