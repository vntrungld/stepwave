# Defaults for CS2 dataset generation. All ranges are [min, max].
vpk = "~/.local/share/Steam/steamapps/common/Counter-Strike Global Offensive/game/csgo/pak01_dir.vpk"

[hrtf]
url = "https://sofacoustics.org/data/database/mit/mit_kemar_normal_pinna.sofa"
file = "mit_kemar_normal_pinna.sofa"

[split]
# Chosen from the extracted CS2 tree: mid-sized pools, so train keeps the big ones
# (common, cache, nuke / land, water) and val still has variety.
holdout_maps = ["overpass"]  # 39 ambience files
holdout_surfaces = ["tile"]  # 14 footstep files
train_hours = 50.0
val_hours = 5.0

[scene]
clip_seconds = 10.0
footstep_probability = 0.7
footstep_sequences = [1, 3]
step_interval_s = [0.3, 0.6]
sequence_span_s = [1.0, 10.0]
gunfire_bursts = [0, 3]
own_gunfire_probability = 0.5
shots_per_burst = [1, 5]
shot_interval_s = [0.08, 0.15]
enemy_distance_m = [5.0, 40.0]
explosions = [0, 1]
other = [0, 2]
azimuth_deg = [0.0, 360.0]
elevation_deg = [-20.0, 30.0]
distance_m = [1.0, 40.0]
footstep_snr_db = [-30.0, 0.0]

[render]
rt60_s = [0.2, 1.2]
wet = [0.05, 0.3]
lpf_min_hz = 2000.0
lpf_max_hz = 20000.0

[bus]
threshold_dbfs = -18.0
ratio = 3.0
attack_ms = 5.0
release_ms = 100.0
loudness_rms_dbfs = [-35.0, -15.0]
peak_ceiling_dbfs = -1.0
