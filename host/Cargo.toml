[package]
name = "stepwave-host"
description = "Platform-neutral stepwave runtime: processor swaps, engine, control protocol, profiles"
version.workspace = true
edition.workspace = true

[dependencies]
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stepwave-core = { path = "../core" }

[dev-dependencies]
tempfile = "3"
